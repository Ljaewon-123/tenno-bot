name: deploy

on:
  push:
    branches: [main]

# 연달아 push하면 먼저 시작한 실행이 늦게 끝나 옛 커밋으로 deploy를 덮어쓸 수 있다
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # vitest는 swc로 돌아 타입 체크를 안 한다 — 타입 에러는 build에서만 잡힌다
      - run: npm run build
      - run: npm test
      - name: push to deploy
        run: git push --force origin HEAD:deploy

  # 봇 테스트가 깨져도 랜딩 배포는 막히지 않도록 job을 분리한다 — Cloudflare Workers Builds가 landing 브랜치를 본다.
  push-landing:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: landing/.node-version
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm test
      - name: push to landing
        run: git push --force origin HEAD:landing
